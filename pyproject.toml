[project]
name = "python-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "dronekit>=2.9.2",
    "future>=1.0.0",
    "matplotlib>=3.10.7",
    "nptyping>=2.0.1",
    "numpy==1.26.4",
    "svgpathtools>=1.7.1",
    "utm>=0.8.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "gitlint>=0.19.1",
    "prek>=0.4.14",
    "ruff>=0.16.3",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
# If uv is being used, this should match where uv creates the virtual environment
venvPath = "."
venv = ".venv"
reportUnusedCallResult = false
reportMissingTypeStubs = false
reportAny = false
# TODO(drone-port): interdrone Message.data is dict[str, Any] until its consumers
# stop relying on numeric coercion; inline "remove any" TODOs track the cleanup.
reportExplicitAny = false
# TODO(drone-port): remove once the drone/ and Station/ packages are ported;
# until then drone.json_parser and Station.point resolve against stubs in
# typings/ with no runtime source.
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.ruff.lint]
ignore = ["BLE001", "LOG015"]
