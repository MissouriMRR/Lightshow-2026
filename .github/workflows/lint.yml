name: Lint

on:
  push:
    branches: [develop]
  workflow_dispatch:
  pull_request:

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check --output-format=github .

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff format check
        run: uv run ruff format --check .

  basedpyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: trick basedpyright
        run: touch opengl_station.abi3.so

      - name: Run basedpyright
        run: uv run basedpyright --level error

  compile-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - parallel:
        - name: Install Qt
          run: |
            uv pip install aqtinstall
            uv run aqt install-qt linux desktop 6.12.0 --archives qtbase

        - name: Install cpp dependencies
          uses: eclipse-score/apt-install@main
          with:
            packages: libfreetype-dev libassimp-dev libx11-dev build-essential libxi-dev libxrandr-dev zlib1g-dev libbz2-dev libpng-dev libbrotli-dev python3-dev

      - name: Compile station
        run: ./compileOpenglGUI.sh

  clang-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openglGUI
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        uses: eclipse-score/apt-install@main
        with:
          packages: cmake clang-format

      - name: Init cmake
        run: cmake -S . -B build -DDO_BUILD=OFF

      - name: Run clang-format format check
        run: cmake --build build -t check-format
