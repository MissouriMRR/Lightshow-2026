name: Lint

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check --output-format=github .

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff format check
        run: uv run ruff format --check .

  basedpyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Install cpp dependencies
        run: |
          sudo apt update
          sudo apt install -y libfreetype-dev libassimp-dev libglfw3-dev libx11-dev build-essential libxi-dev libxrandr-dev zlib1g-dev libbz2-dev libpng-dev libbrotli-dev python3-dev

      - name: Compile station
        run: ./compileOpenglGUI.sh

      - name: Run basedpyright
        run: uv run basedpyright --level error

  clang-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openglGUI
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake-format
        run: |
          sudo apt update
          sudo apt install -y cmake cmake-format

      - name: Init cmake
        run: cmake -S . -B build

      - name: Run clang-format format check
        run: cmake --build build -t check-format
